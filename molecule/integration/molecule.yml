---
role_name_check: 1
driver:
  name: docker
platforms:
  - name: clickhouse-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - clickhouse
  - name: vector-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - vector
  - name: lighthouse-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - lighthouse

provisioner:
  name: ansible
  env:
    TMPDIR: /var/tmp
  config_options:
    defaults:
      allow_broken_conditionals: true
      remote_tmp: /var/tmp/.ansible/tmp
    connection:
      pipelining: true

verifier:
  name: ansible

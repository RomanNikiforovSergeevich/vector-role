---
- name: Install prerequisite packages
  apt:
    name: [apt-transport-https, ca-certificates, curl, gnupg, python3-debian]
    state: present
    update_cache: true

- name: Add Vector repository (Datadog)
  deb822_repository:
    name: vector
    types: deb
    uris: https://apt.vector.dev
    suites: stable
    components: vector-0
    signed_by: https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public
    state: present

- name: Install Vector packages
  apt:
    name: vector
    state: present
    update_cache: true

- name: Ensure Vector data directory exists
  file:
    path: "{{ vector_data_dir }}"
    state: directory
    owner: vector
    group: vector
    mode: '0755'

- name: Create Vector configuration
  template:
    src: vector.yaml.j2
    dest: /etc/vector/vector.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Restart Vector

- name: Ensure Vector service is running
  service:
    name: vector
    state: started
    enabled: true
